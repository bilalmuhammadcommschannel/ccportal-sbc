#!/usr/sbin/nft -f
# CommsChannel SBC firewall. Rendered by install.sh (placeholders filled).
# Default posture: portal public (80/443), SIP restricted to the carrier_v4 /
# admin_v4 sets (EMPTY on a fresh install => SIP effectively closed until you add
# trusted IPs, or the installer opens it to the world on your explicit opt-in).

flush ruleset

table inet filter {
    # Trusted carrier signalling IPs — add carriers here: `nft add element inet filter carrier_v4 { 203.0.113.10 }`
    set carrier_v4 {
        type ipv4_addr
        flags interval
    }
    # Operator/admin IPs (office, VPN) — add: `nft add element inet filter admin_v4 { 198.51.100.5 }`
    set admin_v4 {
        type ipv4_addr
        flags interval
    }

    # RTP media notracked so the 16k-port range can't exhaust conntrack
    chain raw_pre {
        type filter hook prerouting priority raw; policy accept;
        udp dport 20000-60000 notrack
        udp sport 20000-60000 notrack
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif lo accept

        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded, parameter-problem } limit rate 10/second accept
        ip6 nexthdr ipv6-icmp accept

        udp dport 68 accept
        udp sport 67 udp dport 68 accept

        # anti-flood on the public web ports
        tcp dport { 80, 443 } ct state new meter cc_synflood_v4 { ip saddr limit rate over 80/second burst 160 packets } drop
        tcp dport { 80, 443 } ct state new meter cc_webconn_v4 { ip saddr ct count over 300 } drop

        tcp dport 22 accept
        tcp dport 80 accept comment "ACME + https redirect"
        tcp dport 443 accept comment "portal https"

        # trusted carrier + admin SIP/RTP (unlimited); sets empty => no match => closed
        udp dport 5060 ip saddr @carrier_v4 accept
        tcp dport 5060 ip saddr @carrier_v4 accept
        tcp dport 5061 ip saddr @carrier_v4 accept
        udp dport 20000-60000 ip saddr @carrier_v4 accept
        udp dport 5060 ip saddr @admin_v4 accept
        tcp dport 5060 ip saddr @admin_v4 accept
        tcp dport 5061 ip saddr @admin_v4 accept
        udp dport 20000-60000 ip saddr @admin_v4 accept

        # __PUBLIC_SIP_RULES__

        # internal-only services never reachable off-box
        tcp dport { 3306, 5080, 8021 } counter drop comment "internal services"
        udp dport 5080 counter drop

        counter comment "dropped by policy"
    }

    chain forward { type filter hook forward priority filter; policy drop; }
    chain output { type filter hook output priority filter; policy accept; }
}
