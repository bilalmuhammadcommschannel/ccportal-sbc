# CommsChannel portal — vulnerability scanners.
# The portal has a small, known URL surface, so an IP generating many misses
# (404/403/405) is a scanner, not a user. nginx combined format:
#   1.2.3.4 - - [12/Aug/2026:01:07:16 +0000] "GET /wp-admin HTTP/2.0" 404 6659 "-" "curl"
[Definition]
failregex = ^<HOST> .* "(?:GET|POST|HEAD|PUT|DELETE|OPTIONS|PATCH)[^"]*" (?:404|403|405|444) \d+
ignoreregex = ^<HOST> .* "GET /(?:favicon\.ico|robots\.txt)[^"]*"
datepattern = \[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
