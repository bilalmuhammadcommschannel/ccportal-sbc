# CommsChannel SBC — SIP digest auth failures.
# Kamailio writes a fixed-format line per failure from route[AUTH]:
#   ... CC-SBC auth failure user=<u> from=<ip> method=INVITE fails=<n>
# Registration scanners and credential-stuffing both land here.
[Definition]
failregex = CC-SBC auth failure user=\S* from=<HOST> method=\S+
            CC-SBC banning <HOST> after repeated auth failures
            CC-SBC pike flood from <HOST>
            CC-SBC malformed request from <HOST>
ignoreregex =
