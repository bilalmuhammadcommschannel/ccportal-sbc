# CommsChannel portal — failed logins and throttle-grinding.
# Lines are written by Auth\LoginController via the dedicated 'auth' log channel:
#   [2026-08-12 01:05:56] production.WARNING: portal auth failure for a@b from 1.2.3.4
[Definition]
failregex = portal auth (?:failure|throttled) for .* from <HOST>
ignoreregex = portal auth success
datepattern = ^\[%%Y-%%m-%%d %%H:%%M:%%S\]
