[Service]
# Re-seed the carrier/endpoint trust ACL (carrieracl/regacl htables + nftables
# carrier_v4) immediately after Kamailio (re)starts, so a trusted carrier that
# addresses the bare IP is not caught by the bare-IP permaban during the short
# window before the next cc-stats collector cycle.
ExecStartPost=-/bin/systemctl --no-block start cc-stats.service
