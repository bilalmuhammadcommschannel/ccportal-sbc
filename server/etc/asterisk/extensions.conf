; CommsChannel SBC — production dialplan (chan_sip media anchor).
; Routing + billing delegated to the portal via AGI (reuses /switch/route +
; /switch/cdr). Handles inbound (carrier->DID->endpoint) and outbound
; (customer->carrier), all DIDs/accounts, with rating + credit debit on hangup.
[from-kamailio]
exten => _X.,1,NoOp(CC dest=${EXTEN} dir=${SIP_HEADER(X-CC-Direction)})
 same => n,Set(CHANNEL(hangup_handler_push)=cc-cdr,s,1)
 same => n,Set(cc_dir=${SIP_HEADER(X-CC-Direction)})
 same => n,Set(cc_user=${SIP_HEADER(X-CC-User)})
 same => n,Set(cc_src=${SIP_HEADER(X-CC-Src)})
 same => n,AGI(cc-route.py)
 same => n,GotoIf($["${ROUTE_ACTION}"="reject"]?rej,1)
 same => n,Dial(${DIALSTRING},60,${CC_DIALOPTS})
 same => n,Hangup()
exten => rej,1,NoOp(CC rejected)
 same => n,Hangup(${ROUTE_HANGUP_CAUSE})

; hangup handler -> rate + debit + release credit hold
[cc-cdr]
exten => s,1,AGI(cc-cdr.py)
 same => n,Return()

[default]
exten => _X.,1,Hangup()
