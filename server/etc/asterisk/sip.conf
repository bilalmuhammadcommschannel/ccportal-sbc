; CommsChannel SBC — chan_sip media anchor (matches MagnusBilling's Asterisk 13
; behaviour: chan_sip terminates media and RE-FRAMES the RTP to a constant 20ms,
; which chan_pjsip and FreeSWITCH could not do for the Yeastar's async ptime).
; SIP on loopback (Kamailio is the edge). RTP socket binds 0.0.0.0 so it receives
; on the public IP; Kamailio rewrites the 127.0.0.1 media address in the SDP to
; __PUBLIC_IP__ on the way out (subst_body already in kamailio.cfg).

[general]
context=default
udpbindaddr=0.0.0.0:5065
tcpenable=no
transport=udp
allowguest=no
srvlookup=no
allowoverlap=no
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833
directmedia=no          ; anchor + re-clock media (never bypass)
relaxdtmf=yes
rtptimeout=60
rtpholdtimeout=300

; ---- the one peer: Kamailio (loopback) — receive from + dial back to ----
[kamailio]
type=friend
host=127.0.0.1
port=5060
context=from-kamailio
insecure=port,invite    ; Kamailio already authenticated; don't re-challenge
disallow=all
allow=ulaw
allow=alaw
dtmfmode=rfc2833
directmedia=no
nat=no
qualify=no
