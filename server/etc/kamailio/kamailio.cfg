#!KAMAILIO
#
# CommsChannel SIP proxy — public edge.
#
# Architecture (operator's design):
#   Internet ──5060/udp,tcp · 5061/tls──> Kamailio (this file)
#                                            │  authenticates every REGISTER/INVITE
#                                            │  against kamailio.subscriber, which is a
#                                            │  VIEW over switch.customer_sip_account
#                                            │  (portal is the single source of truth)
#                                            ▼
#                                   FreeSWITCH 127.0.0.1:5065  (loopback only)
#                                   runs the portal's xml_curl dialplan,
#                                   rates the call, handles media, bridges to carrier.
#
# Security posture for a PUBLIC port:
#   * no anonymous anything — REGISTER and INVITE both require digest auth
#   * any client-supplied X-CC-User header is STRIPPED before we add our own,
#     so the identity FreeSWITCH trusts cannot be forged from outside
#   * pike + ipban htable rate-limits floods; failures are logged for fail2ban
#   * FreeSWITCH's internal profile listens on loopback ONLY, so nothing can
#     reach the trusted leg directly

####### Defined Values #########
#!substdef "!MY_IP_ADDR!__PUBLIC_IP__!g"
#!substdef "!MY_DOMAIN!__DOMAIN__!g"
#!substdef "!MY_UDP_ADDR!udp:__PUBLIC_IP__:5060!g"
#!substdef "!MY_TCP_ADDR!tcp:__PUBLIC_IP__:5060!g"
#!substdef "!MY_TLS_ADDR!tls:__PUBLIC_IP__:5061!g"
#!substdef "!FS_SOCK!sip:127.0.0.1:5065!g"
#!substdef "!MY_LO_ADDR!udp:127.0.0.1:5060!g"
#!define DBURL "mysql://kamailio:__KAM_DB_PASS__@localhost/kamailio"

####### Global Parameters #########
debug=1
log_stderror=yes
log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "

children=8
auto_aliases=no

# TLS must be enabled in the core before the tls module will bind
enable_tls=1

alias=MY_DOMAIN

listen=MY_UDP_ADDR
listen=MY_TCP_ADDR
listen=MY_TLS_ADDR
# loopback leg towards FreeSWITCH - never reachable from outside
listen=MY_LO_ADDR

tcp_connection_lifetime=3605
tcp_max_connections=2048
tls_max_connections=2048

# do not answer to our own scans / keep the proxy quiet
server_signature=no
server_header="Server: CommsChannel SBC"
user_agent_header="User-Agent: CommsChannel SBC"

####### Modules #########
mpath="/usr/lib/x86_64-linux-gnu/kamailio/modules/"

loadmodule "kex.so"
loadmodule "corex.so"
loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "textopsx.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "counters.so"
loadmodule "db_mysql.so"
loadmodule "auth.so"
loadmodule "auth_db.so"
loadmodule "usrloc.so"
loadmodule "registrar.so"
loadmodule "nathelper.so"
loadmodule "pike.so"
loadmodule "htable.so"
loadmodule "tls.so"
loadmodule "ipops.so"


# ----- tm -----
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 60000)

# ----- rr -----
modparam("rr", "append_fromtag", 0)

# ----- registrar / usrloc -----
# db_mode 1 = write-through, so registrations survive a restart
modparam("usrloc", "db_url", DBURL)
modparam("usrloc", "db_mode", 1)
modparam("usrloc", "use_domain", 0)
modparam("registrar", "max_expires", 3600)
modparam("registrar", "min_expires", 60)
modparam("registrar", "default_expires", 600)
# one AoR may have a bounded number of contacts (a client looping REGISTER
# must not be able to grow location without limit)
modparam("registrar", "max_contacts", 6)

# ----- auth / auth_db -----
# The subscriber "table" is a VIEW over switch.customer_sip_account; passwords are
# stored as the plaintext SIP secret, so Kamailio computes HA1 on the fly.
modparam("auth_db", "db_url", DBURL)
modparam("auth_db", "calculate_ha1", 1)
modparam("auth_db", "password_column", "password")
modparam("auth_db", "user_column", "username")
modparam("auth_db", "domain_column", "domain")
modparam("auth_db", "use_domain", 0)
modparam("auth_db", "load_credentials", "")
modparam("auth", "nonce_expire", 60)

# ----- nathelper -----
modparam("nathelper", "received_avp", "$avp(RECEIVED)")

# ----- pike: per-source request rate limiting -----
modparam("pike", "sampling_time_unit", 2)
modparam("pike", "reqs_density_per_unit", 30)
modparam("pike", "remove_latency", 120)

# ----- htable: transient ban list -----
modparam("htable", "htable", "ipban=>size=10;autoexpire=900;")
# permanent ban list (no autoexpire) for bare-IP scanners
modparam("htable", "htable", "ipbanperm=>size=12;")
# initval=0 makes $sht(ipfail=>$si)+1 safe on a key that does not exist yet
modparam("htable", "htable", "ipfail=>size=10;autoexpire=600;initval=0;")

# ----- tls -----
modparam("tls", "config", "/etc/kamailio/tls.cfg")

####### Routing #########

request_route {
    # SECURITY (F1): sanitise client-supplied identity headers on EVERY path
    # (including in-dialog/loose_route) before any branch can relay to
    # FreeSWITCH. Without this a forged in-dialog request asserts an
    # arbitrary billed tenant. route[TOFS] re-adds the AUTHENTICATED value.
    remove_hf("X-CC-User");
    remove_hf("X-CC-Src");
    # X-CC-Direction is set only by us (trusted inbound-carrier branch); strip
    # any client-supplied copy so it cannot be forged into the FreeSWITCH path.
    remove_hf("X-CC-Direction");

    # --- absolute basics ---
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }
    if (!sanity_check("17895", "7")) {
        xlog("L_WARN", "CC-SBC malformed request from $si\n");
        exit;
    }

    # --- already-banned source: drop silently (no reply = no amplification) ---
    if ($sht(ipban=>$si) != $null) {
        xlog("L_NOTICE", "CC-SBC dropping banned source $si\n");
        exit;
    }


    # --- reject SIP addressed to the bare IP -------------------------------
    # Legitimate clients and carriers address us by FQDN (or are a trusted
    # carrier IP). Scanners blast the raw address. Anything targeting the bare
    # IP is hostile: ban it permanently and answer nothing.
    if ($rd == "__PUBLIC_IP__" || $rd == "MY_IP_ADDR") {
        # never ban ourselves, loopback, the carrier, or the operator
        if ($si != "__PUBLIC_IP__" && $si != "__PUBLIC_IP__"
            && $si != "127.0.0.1" && $si != "__PUBLIC_IP__" && $si != "__PUBLIC_IP__"
            && $si != "__PUBLIC_IP__"
            && !is_in_subnet($si, "54.252.254.64/26")) {
            $sht(ipbanperm=>$si) = 1;
            xlog("L_WARN", "CC-SBC BAREIP scan from $si to $rd — permanent ban\n");
            exit;
        }
    }
    if ($sht(ipbanperm=>$si) != $null) {
        exit;
    }

    # --- flood protection: trusted carrier/admin are exempt so a
    #     legitimate busy-hour burst cannot pike-ban the trunk (F12/F13/F18) ---
    if ($si != "__PUBLIC_IP__" && $si != "__PUBLIC_IP__" && $si != "127.0.0.1"
        && $si != "__PUBLIC_IP__" && $si != "__PUBLIC_IP__" && $si != "__PUBLIC_IP__"
        && !is_in_subnet($si, "54.252.254.64/26")) {
        if (!pike_check_req()) {
            xlog("L_WARN", "CC-SBC pike flood from $si — banning\n");
            $sht(ipban=>$si) = 1;
            exit;
        }
    }

    # --- NAT detection ---
    force_rport();
    if (nat_uac_test("19")) {
        if (is_method("REGISTER")) {
            fix_nated_register();
        } else {
            fix_nated_contact();
        }
        setflag(6);
    }

    # --- keepalives ---
    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }

    # --- CANCEL / in-dialog ---
    if (is_method("CANCEL")) {
        if (t_check_trans()) { t_relay(); }
        exit;
    }
    if (has_totag()) {
        if (loose_route()) {
            # in-dialog: the only legitimate next hops are FreeSWITCH
            # (loopback) or, for requests FROM FreeSWITCH, a customer
            # contact. Refuse to relay to arbitrary third parties (F1).
            if ($si == "127.0.0.1" || $dd == "127.0.0.1") {
                route(RELAY);
            } else {
                xlog("L_WARN", "CC-SBC blocked in-dialog relay $si -> $dd ru=$ru\n");
                sl_send_reply("403", "Forbidden");
            }
        } else {
            if (is_method("ACK")) {
                if (t_check_trans()) { t_relay(); }
                exit;
            }
            sl_send_reply("404", "Not Found");
        }
        exit;
    }

    t_check_trans();

    # --- INBOUND from a trusted carrier ------------------------------------
    # Carriers cannot digest-auth. Set the carrier's INBOUND source IP(s) below
    # (replace/extend __PUBLIC_IP__) so their INVITEs skip auth and are handed to
    # FreeSWITCH for DID routing + inbound rating. Left as __PUBLIC_IP__ = the
    # server's own IP = effectively OFF until you configure a real carrier IP.
    # 54.252.254.64/26 = Twilio AU1 signalling (public range); extend/replace
    # with your inbound carrier's signalling subnet(s).
    if (is_method("INVITE") && (is_in_subnet($si, "54.252.254.64/26") || $si == "__PUBLIC_IP__")) {
        append_hf("X-CC-Direction: inbound\r\n");
        record_route();
        route(TOFS);
        exit;
    }

    # --- FreeSWITCH delivering an inbound call to a registered endpoint -----
    # FS bridges the inbound leg to sofia/internal/<user>@127.0.0.1:5060, so it
    # arrives from loopback. Locate the AoR in usrloc and relay to the phone.
    if (is_method("INVITE") && $si == "127.0.0.1") {
        if (!lookup("location")) {
            sl_send_reply("480", "User Not Registered");
            exit;
        }
        record_route();
        route(RELAY);
        exit;
    }

    # --- REGISTER ---
    if (is_method("REGISTER")) {
        route(AUTH);
        if (!save("location")) {
            sl_reply_error();
        }
        xlog("L_INFO", "CC-SBC registered $au from $si\n");
        exit;
    }

    # --- INVITE and everything else that changes state needs auth ---
    if (is_method("INVITE|SUBSCRIBE|MESSAGE|REFER")) {
        route(AUTH);
        if (is_method("INVITE")) { record_route(); }
        route(TOFS);
        exit;
    }

    sl_send_reply("405", "Method Not Allowed");
    exit;
}

# Digest authentication against the portal's endpoint credentials.
# A failure is logged in a fixed format so fail2ban can ban the source.
route[AUTH] {
    if (!auth_check("$fd", "subscriber", "1")) {
        # A first request never carries credentials, so challenging it is normal
        # SIP rather than an attack. Only count a failure when credentials were
        # actually PRESENT and wrong -- otherwise fail2ban bans every legitimate
        # phone simply for registering or placing a call.
        if (is_present_hf("Authorization") || is_present_hf("Proxy-Authorization")) {
            xlog("L_WARN", "CC-SBC auth failure user=$fU from=$si method=$rm\n");
            $sht(ipfail=>$si) = $sht(ipfail=>$si) + 1;
            if ($sht(ipfail=>$si) > 10) {
                $sht(ipban=>$si) = 1;
                xlog("L_WARN", "CC-SBC banning $si after repeated auth failures\n");
            }
        }
        auth_challenge("$fd", "0");
        exit;
    }
    # authenticated — drop the credentials so they are not forwarded onward
    consume_credentials();
    $sht(ipfail=>$si) = 0;
}

# Hand an authenticated call to FreeSWITCH on loopback, carrying the
# authenticated identity in a trusted header.
route[TOFS] {
    # CRITICAL: strip any client-supplied identity header before we set ours,
    # otherwise a caller could assert someone else's account to FreeSWITCH.
    remove_hf("X-CC-User");
    remove_hf("X-CC-Src");
    append_hf("X-CC-User: $au\r\n");
    append_hf("X-CC-Src: $si\r\n");

    force_send_socket(MY_LO_ADDR);
    $du = "FS_SOCK";
    route(RELAY);
}

route[RELAY] {
    # The FreeSWITCH leg must ALWAYS leave from the loopback socket. FS applies
    # apply-inbound-acl=loopback.auto, which matches on SOURCE address. This has
    # to cover in-dialog requests too: without it the customer BYE is sourced
    # from the public IP, FreeSWITCH ignores it, and the call stays up until the
    # far end gives up.
    if ($rd == "127.0.0.1" || $dd == "127.0.0.1") {
        force_send_socket(MY_LO_ADDR);
    }
    if (isflagset(6)) {
        # NAT'd client — ask FreeSWITCH to handle media symmetric
        append_hf("X-CC-Nat: 1\r\n");
    }
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}

onreply_route {
    if (nat_uac_test("1")) {
        fix_nated_contact();
    }
}
