# CommsChannel SIP TLS. Uses the same Let's Encrypt certificate as the portal,
# so clients validate against __DOMAIN__.
[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/privkey.pem
certificate = /etc/kamailio/tls/fullchain.pem

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
