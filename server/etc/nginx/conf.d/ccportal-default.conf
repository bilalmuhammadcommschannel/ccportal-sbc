# default_server_reject: anything arriving without the correct Host (bare-IP
# scans, wrong vhost) is dropped without a response. The portal is only ever
# reached by name.
server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    return 444;
}
