# Edge rate limits for the portal. Cheap first line of defence: a flood never
# reaches PHP, and fail2ban handles the persistent offenders.
limit_req_zone $binary_remote_addr zone=cc_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=cc_general:10m rate=120r/m;
limit_req_status 429;
limit_conn_zone $binary_remote_addr zone=cc_conn:10m;
