server {
    listen 127.0.0.1:8080;
    server_name _;
    root /var/www/ccportal/public;
    access_log /var/log/nginx/ccswitch_access.log;
    index index.php;
    server_tokens off;
    location /switch/ { try_files $uri /index.php?$query_string; }
    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param HTTP_X_CC_SWITCH_SECRET "__SWITCH_SECRET__";
        fastcgi_hide_header X-Powered-By;
    }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_CC_SWITCH_SECRET "__SWITCH_SECRET__";
        fastcgi_hide_header X-Powered-By;
    }
    location / { return 403; }
}
