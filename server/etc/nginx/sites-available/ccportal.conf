server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name __DOMAIN__;
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    # F29 — reject any request whose Host is not ours (Host-header injection);
    # this server is the 443 default, so an attacker Host would otherwise reach PHP.
    if ($host != "__DOMAIN__") { return 444; }

    root /var/www/ccportal/public;
    access_log /var/log/nginx/ccportal_access.log;
    error_log  /var/log/nginx/ccportal_error.log;
    index index.php;
    client_max_body_size 12M;

    # Stable path populated by install.sh + the certbot deploy hook (decoupled
    # from /etc/letsencrypt/live so a self-signed placeholder never collides with
    # certbot's own managed lineage directory).
    ssl_certificate     /etc/ssl/ccportal/fullchain.pem;
    ssl_certificate_key /etc/ssl/ccportal/privkey.pem;
    ssl_trusted_certificate /etc/ssl/ccportal/chain.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # F34 — explicit modern cipher suite (Mozilla intermediate), OCSP stapling,
    # no session tickets (forward secrecy)
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Permitted-Cross-Domain-Policies none always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # F33 — CSP + Permissions-Policy. 'unsafe-inline' is required because the
    # portal ships inline <script>/<style>; still blocks all external origins,
    # framing, plugins, and base-uri hijack.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    server_tokens off;

    # F30 — the switch API is loopback-only (served on 127.0.0.1:8080); it must
    # never be reachable via the public vhost, regardless of app-level checks.
    location ^~ /switch/ { deny all; return 404; }

    # strict limit on the auth endpoint; generous elsewhere
    location = /login {
        limit_req zone=cc_login burst=5 nodelay;
        limit_conn cc_conn 10;
        try_files $uri /index.php?$query_string;
    }

    location / {
        limit_req zone=cc_general burst=40 nodelay;
        limit_conn cc_conn 20;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_HOST $host:$server_port;  # restore port stripped by Debian fastcgi_params $host workaround
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known) { deny all; }
    location = /favicon.ico { access_log off; log_not_found off; }
}
